name: Validate userscript
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=low
      - name: Install verified Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --pattern gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan complete history and published tree
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all" --redact --no-banner
          mkdir -p "$RUNNER_TEMP/publish-scan"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/publish-scan"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$RUNNER_TEMP/publish-scan" --redact --no-banner
